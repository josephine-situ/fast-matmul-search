[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-matmul-search"
version = "0.2.0"
description = "Search and certified bounds for fast matrix multiplication tensor decompositions"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.0",
    "cvxpy>=1.5",
    "clarabel>=0.9",
]

[project.optional-dependencies]
mosek = ["mosek>=10.2"]

[project.scripts]
polyopt-certify = "polyopt.cli:main_certify"
polyopt-validate = "polyopt.cli:main_validate"
polyopt-bb = "polyopt.cli:main_bb"

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "tensor_utils",
    "continuous_search",
    "finite_field_search",
    "hardcode_known",
    "numerical_stability",
    "omega_analysis",
    "run_experiments",
    "validation",
    "flip_graph_hybrid",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["polyopt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running certificate tests"]
